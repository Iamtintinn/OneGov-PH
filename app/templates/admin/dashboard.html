{% extends "base.html" %}
{% block title %}{{ page_title }} · OneGov PH{% endblock %}
{% block content %}
<section class="page">
    <div class="site-width">
        <p class="kicker">{{ current_user.role_label }}</p>
        <h1>{{ page_title }}</h1>
        <p class="lede">{{ page_text }}</p>
        <dl class="summary">
            <div>
                <dt>Name</dt>
                <dd>{{ current_user.full_name }}</dd>
            </div>
            <div>
                <dt>Role</dt>
                <dd>{{ current_user.role_label }}</dd>
            </div>
        </dl>
    </div>
</section>
{% endblock %}
