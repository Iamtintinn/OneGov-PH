{% extends "base.html" %}
{% block title %}Log in · OneGov PH{% endblock %}
{% block content %}
<section class="login-screen">
    <div class="login-backdrop" aria-hidden="true"></div>
    <div class="login-wrap">
        <div class="login-card">
            <p class="kicker">Account</p>
            <h1>Log in</h1>
            <p class="lede">Use the email and password for your OneGov PH account.</p>
            <form class="login-form" method="post" action="{{ url_for('auth.login') }}" novalidate>
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                {% if next_url %}<input type="hidden" name="next" value="{{ next_url }}">{% endif %}
                {% if error %}
                <p class="form-error" role="alert">{{ error }}</p>
                {% endif %}
                <label for="email">Email address</label>
                <input id="email" name="email" type="email" autocomplete="username" spellcheck="false" value="{{ email }}" required>
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
                <button class="submit" type="submit">Log in</button>
                <p class="form-links">No account yet? <a href="{{ url_for('auth.register') }}">Register as a citizen</a>.</p>
            </form>
        </div>
    </div>
</section>
{% endblock %}
